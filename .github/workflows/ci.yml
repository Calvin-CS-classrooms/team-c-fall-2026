name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check TypeScript
        run: npm run lint

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Tests use mock data and a mocked Supabase client (see server/jest.setup.js),
      # so no database credentials are needed in CI.
      - name: Run tests
        run: npm test
      - name: Check the server starts
        run: |
          USE_MOCK_DATA=true node index.js &
          sleep 3
          curl --fail --silent http://localhost:3000/api/locations > /dev/null
          kill %1
